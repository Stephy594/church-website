<section class="admin-login-page">

  <div class="bg-circle bg1"></div>
  <div class="bg-circle bg2"></div>
  <div class="bg-circle bg3"></div>

  <div class="login-card">

   <div class="login-logo">
    <img
      src="images/Logo.jpg"
      alt="El-Shaddai Church Logo">
</div>

    <h1>Admin Portal</h1>

    <p>
      El-Shaddai Church Website Management
    </p>

    <form (ngSubmit)="login()">

      <label>Email</label>

      <div class="input-group">

        <span>📧</span>

        <input
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="Admin Email"
          autocomplete="email"
          required>

      </div>


      <label>Password</label>

      <div class="input-group">

        <span>🔒</span>

        <input
          [type]="showPassword ? 'text' : 'password'"
          name="password"
          [(ngModel)]="password"
          placeholder="Password"
          autocomplete="current-password"
          required>

        <button
          type="button"
          class="eye-btn"
          (click)="showPassword=!showPassword">

          {{showPassword ? '🙈' : '👁'}}

        </button>

      </div>

      <p
        class="error-message"
        *ngIf="errorMessage">

        {{errorMessage}}

      </p>

      <button
        class="login-btn"
        type="submit"
        [disabled]="isLoading">

        {{isLoading ? 'Signing In...' : 'Login'}}

      </button>

    </form>

    <div class="secure">

        🔐 Secure Admin Access

    </div>

  </div>

</section>
