<section class="module-page"><header class="module-hero"><p class="eyebrow">Church updates</p><h1>Announcements</h1><p>Create timely notices for the church community.</p></header><section class="panel"><div class="toolbar"><h2>New announcement</h2></div><form class="form-grid" (ngSubmit)="add()"><label class="label full">Title<input class="field" name="title" [(ngModel)]="form.title" required></label><label class="label full">Message<textarea class="field" name="message" [(ngModel)]="form.message" required></textarea></label><label class="label"><span><input type="checkbox" name="published" [(ngModel)]="form.published"> Published</span></label><div><button class="btn btn-primary" [disabled]="busy">{{busy?'Publishing…':'Add announcement'}}</button></div></form></section><section class="panel"><div class="toolbar"><h2>Announcements</h2></div><div class="grid" *ngIf="items$|async as items"><div class="empty" *ngIf="!items.length">No announcements yet.</div><article class="item" *ngFor="let x of items"><div><h3>{{x.title}}</h3><p>{{x.message}}</p><div class="meta"><span class="badge" [class.gold]="!x.published">{{x.published?'Published':'Draft'}}</span></div></div><button class="btn btn-danger" (click)="remove(x)">Delete</button></article></div></section></section>
