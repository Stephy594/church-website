<section class="module-page"><header class="module-hero"><p class="eyebrow">Weekly encouragement</p><h1>Bible Verse</h1><p>Manage the verse highlighted on the church website.</p></header><section class="panel"><div class="toolbar"><h2>Verse of the week</h2></div><p class="notice" *ngIf="message">{{message}}</p><form class="form-grid" (ngSubmit)="save()"><label class="label">Reference<input class="field" name="reference" [(ngModel)]="form.reference" placeholder="Psalm 46:1" required></label><label class="label">Theme<input class="field" name="theme" [(ngModel)]="form.theme" placeholder="Faith, Hope, Prayer…"></label><label class="label full">Verse<textarea class="field" name="verse" [(ngModel)]="form.verse" required></textarea></label><label class="label"><span><input type="checkbox" name="published" [(ngModel)]="form.published"> Published</span></label><div><button class="btn btn-primary" [disabled]="busy">{{busy?'Saving…':'Save verse'}}</button></div></form></section><section class="panel"><p class="eyebrow">Preview</p><h2>{{form.reference||'Bible reference'}}</h2><p style="font-size:20px;line-height:1.7;color:#355d54">“{{form.verse||'Your selected verse will appear here.'}}”</p><span class="badge gold" *ngIf="form.theme">{{form.theme}}</span></section></section>
