<section class="module-page"><header class="module-hero"><p class="eyebrow">Content manager</p><h1>Events</h1><p>Create, update, publish, or remove church events.</p></header><section class="panel"><div class="toolbar"><h2>{{editing?'Edit event':'Add new event'}}</h2><button class="btn btn-soft" *ngIf="editing" (click)="reset()">Cancel edit</button></div><p class="notice" *ngIf="message">{{message}}</p><form class="form-grid" (ngSubmit)="save()"><label class="label">Title<input class="field" name="title" [(ngModel)]="form.title" required></label><label class="label">Date<input class="field" type="date" name="date" [(ngModel)]="form.date" required></label><label class="label">Time<input class="field" type="time" name="time" [(ngModel)]="form.time"></label><label class="label">Location<input class="field" name="location" [(ngModel)]="form.location"></label><label class="label full">Description<textarea class="field" name="description" [(ngModel)]="form.description"></textarea></label><label class="label"><span><input type="checkbox" name="published" [(ngModel)]="form.published"> Publish on website</span></label><div><button class="btn btn-primary" [disabled]="busy">{{busy?'Saving…':'Save event'}}</button></div></form></section><section class="panel"><div class="toolbar"><h2>All events</h2></div><div class="grid" *ngIf="items$|async as items"><div class="empty" *ngIf="!items.length">No events created yet.</div><article class="item" *ngFor="let x of items"><div><h3>{{x.title}}</h3><p>{{x.description||'No description provided.'}}</p><div class="meta"><span class="badge" [class.gold]="!x.published">{{x.published?'Published':'Draft'}}</span><span>{{x.date}} {{x.time}}</span><span>{{x.location}}</span></div></div><div class="actions"><button class="btn btn-soft" (click)="edit(x)">Edit</button><button class="btn btn-danger" (click)="remove(x)">Delete</button></div></article></div></section></section>
