<section class="module-page"><header class="module-hero"><p class="eyebrow">Administration</p><h1>Church Settings</h1><p>Keep important church contact and social information in one place.</p></header><section class="panel"><p class="notice" *ngIf="message">{{message}}</p><form class="form-grid" (ngSubmit)="save()"><label class="label full">Church name<input class="field" name="churchName" [(ngModel)]="form.churchName"></label><label class="label">Email<input class="field" type="email" name="email" [(ngModel)]="form.email"></label><label class="label">Phone<input class="field" name="phone" [(ngModel)]="form.phone"></label><label class="label full">Address<input class="field" name="address" [(ngModel)]="form.address"></label><label class="label full">Service time<input class="field" name="serviceTime" [(ngModel)]="form.serviceTime"></label><label class="label">Facebook<input class="field" name="facebook" [(ngModel)]="form.facebook"></label><label class="label">Instagram<input class="field" name="instagram" [(ngModel)]="form.instagram"></label><label class="label full">YouTube<input class="field" name="youtube" [(ngModel)]="form.youtube"></label><div><button class="btn btn-primary" [disabled]="busy">{{busy?'Saving…':'Save settings'}}</button></div></form></section></section>
